# databricks.yml — the bundle root. Kept simple on purpose:
#   targets below      = WHERE to deploy (one workspace per environment)
#   resources/<type>/  = WHAT to deploy (jobs, pipelines, test_jobs)
#   resources/variables/variables.yml = WITH WHICH VALUES, plus run_as/permissions, per environment
#   ci_cd/             = WHEN to deploy (main -> dev, uat -> uat, prod -> prod)

bundle:
  name: sales_etl

include:
  - resources/variables/*.yml
  - resources/jobs/*.yml
  - resources/pipelines/*.yml
  - resources/test_jobs/*.yml     # unit + integration test jobs, dev and uat targets only

targets:
  dev:
    mode: development          # [dev <user>] name prefix, schedules paused, dev pipelines
    default: true
    workspace:
      host: https://adb-1111111111111111.11.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

  uat:
    mode: production           # validates run_as, non-dev pipelines, git branch
    workspace:
      host: https://adb-2222222222222222.12.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    git:
      branch: uat

  prod:
    mode: production
    workspace:
      host: https://adb-3333333333333333.13.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    git:
      branch: prod

# Single-workspace setup? Use the same host in all three targets and let
# catalog/schema (set in resources/variables/variables.yml) separate the data.
