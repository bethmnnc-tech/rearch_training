# GitHub Actions: uat, WITH tests. Push to main deploys uat (runs as the uat SP via run_as).
#   unit tests on the runner -> validate -> deploy uat -> test jobs on Databricks -> smoke run
# Copy to .github/workflows/ (GitHub only runs workflows from there).
name: Test and deploy bundle - uat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: databricks-uat
  cancel-in-progress: false

jobs:
  # ---- Stage 1: unit tests on the runner. No Databricks, no secrets. ----
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4        # local PySpark needs a JVM
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: >
          pytest -m "not integration"
          --junitxml=test-results/junit.xml
          --cov=src --cov-report=xml:test-results/coverage.xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  # ---- Stage 2: deploy uat, then integration tests + smoke run on Databricks. ----
  deploy:
    needs: unit-tests                       # a red test stops the deploy
    runs-on: ubuntu-latest
    environment: uat
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_BUNDLE_TARGET: uat
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main     # pin to a release tag in real use
      - run: databricks bundle validate
      - run: databricks bundle deploy
      - name: Tests on Databricks (pytest, temp schema)
        run: databricks bundle run unit_tests
      - name: Pipeline integration tests (SDP expectations + Job tasks)
        run: databricks bundle run sales_integration_tests
      # Optional smoke test of the real job:
      # - run: databricks bundle run sales_daily
