# Azure DevOps pipeline: uat, WITH tests. Register as /cicd/azure-devops/deploy-uat.yml
# Push to main: unit tests -> validate + deploy uat (runs as the uat SP via run_as) -> test jobs on Databricks.
trigger:
  branches:
    include: [main]
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  BUNDLE_TARGET: uat
  SERVICE_CONNECTION: sc-databricks-uat

stages:
  # ---- Stage 1: unit tests on the agent (ubuntu-latest images include Java). ----
  - stage: test
    jobs:
      - job: unit_tests
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: pip install -r requirements-dev.txt
            displayName: Install test dependencies
          - script: >
              pytest -m "not integration"
              --junitxml=test-results/junit.xml
              --cov=src --cov-report=xml:test-results/coverage.xml --cov-fail-under=80
            displayName: Run unit tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results/junit.xml
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: test-results/coverage.xml

  # ---- Stage 2: deploy uat, then integration tests on Databricks. ----
  - stage: deploy
    dependsOn: test
    jobs:
      - deployment: deploy_uat
        environment: databricks-uat      # add checks/approvals on this ADO environment if wanted
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                  displayName: Install Databricks CLI
                - task: AzureCLI@2
                  displayName: Validate, deploy and test bundle in uat
                  inputs:
                    azureSubscription: ${{ variables.SERVICE_CONNECTION }}   # template expression: resolved at compile time
                    useGlobalConfig: true
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      databricks bundle validate -t $(BUNDLE_TARGET)
                      databricks bundle deploy -t $(BUNDLE_TARGET)
                      databricks bundle run unit_tests -t $(BUNDLE_TARGET)
                      databricks bundle run sales_integration_tests -t $(BUNDLE_TARGET)
                      # Optional smoke test of the real job:
                      # databricks bundle run -t $(BUNDLE_TARGET) sales_daily
